<svg xmlns="http://www.w3.org/2000/svg" width="250" height="240" viewBox="0 0 250 240" role="img" aria-label="Currently reading"><title>Currently reading</title><style>
:root{--card:#fff;--stroke:#e9e9e9;--ink:#0d0d0d;--mute:#bdbdbd;--sub:#8c8c8c;--accent:#f26a00;--pill:#f3f3f3;--btn:#0d0d0d;--btnink:#fff}
@media (prefers-color-scheme:dark){:root{--card:#161b22;--stroke:#2a313c;--ink:#f0f3f6;--mute:#4b535e;--sub:#8b949e;--accent:#ff8a2a;--pill:#21262d;--btn:#f0f3f6;--btnink:#0d1117}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.card{fill:var(--card);stroke:var(--stroke);stroke-width:1.5}
.pill{fill:var(--pill)}
.sub{fill:var(--sub)}
.mute{fill:var(--mute)}
.acc{fill:var(--accent)}
</style><defs><clipPath id="clip"><rect width="250" height="240" rx="24"/></clipPath></defs><rect class="card" x=".75" y=".75" width="248.5" height="238.5" rx="24"/><g clip-path="url(#clip)"><rect class="pill" x="16" y="16" width="132" height="26" rx="13"/><text x="28" y="33" font-size="12">What I’m reading</text><text x="16" y="68" font-size="13" font-weight="500">Dieter Rams the</text><text x="16" y="84" font-size="13" font-weight="500">Complete Works</text><text x="16" y="102" font-size="10" class="sub">Klaus Klemp</text><rect x="60" y="116" width="130" height="150" rx="14" class="pill"/><rect x="88" y="132" width="70" height="140" rx="3" fill="#f26a00"/><text transform="translate(142 146) rotate(90)" font-size="34" font-weight="700" letter-spacing="-1" style="fill:#fff">dieter rams</text></g></svg>