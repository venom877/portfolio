<svg xmlns="http://www.w3.org/2000/svg" width="250" height="240" viewBox="0 0 250 240" role="img" aria-label="AWS VPC + ALB lab"><title>AWS VPC + ALB lab</title><style>
:root{--card:#fff;--stroke:#e9e9e9;--ink:#0d0d0d;--mute:#bdbdbd;--sub:#8c8c8c;--accent:#f26a00;--pill:#f3f3f3;--btn:#0d0d0d;--btnink:#fff}
@media (prefers-color-scheme:dark){:root{--card:#161b22;--stroke:#2a313c;--ink:#f0f3f6;--mute:#4b535e;--sub:#8b949e;--accent:#ff8a2a;--pill:#21262d;--btn:#f0f3f6;--btnink:#0d1117}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.card{fill:var(--card);stroke:var(--stroke);stroke-width:1.5}
.pill{fill:var(--pill)}
.sub{fill:var(--sub)}
.mute{fill:var(--mute)}
.acc{fill:var(--accent)}
</style><defs><clipPath id="clip"><rect width="250" height="240" rx="24"/></clipPath></defs><rect class="card" stroke-dasharray="6 6" x=".75" y=".75" width="248.5" height="238.5" rx="24"/><g clip-path="url(#clip)"><rect class="pill" x="16" y="16" width="71" height="26" rx="13"/><text x="28" y="33" font-size="12">Planned</text><text x="18" y="68" font-size="15" font-weight="600">AWS VPC + ALB lab</text><text x="18" y="92" font-size="11" class="sub">Public and private subnets, an ALB,</text><text x="18" y="107" font-size="11" class="sub">EC2 behind it and least-privilege</text><text x="18" y="122" font-size="11" class="sub">IAM roles, with a diagram and a</text><text x="18" y="137" font-size="11" class="sub">short write-up.</text><rect class="pill" x="16" y="202" width="36" height="22" rx="11"/><text x="25" y="217" font-size="11">VPC</text><rect class="pill" x="57" y="202" width="36" height="22" rx="11"/><text x="66" y="217" font-size="11">EC2</text><rect class="pill" x="98" y="202" width="36" height="22" rx="11"/><text x="107" y="217" font-size="11">IAM</text></g></svg>