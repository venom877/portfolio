<svg xmlns="http://www.w3.org/2000/svg" width="250" height="240" viewBox="0 0 250 240" role="img" aria-label="OpsPulse"><title>OpsPulse</title><style>
:root{--card:#fff;--stroke:#e9e9e9;--ink:#0d0d0d;--mute:#bdbdbd;--sub:#8c8c8c;--accent:#f26a00;--pill:#f3f3f3;--btn:#0d0d0d;--btnink:#fff}
@media (prefers-color-scheme:dark){:root{--card:#161b22;--stroke:#2a313c;--ink:#f0f3f6;--mute:#4b535e;--sub:#8b949e;--accent:#ff8a2a;--pill:#21262d;--btn:#f0f3f6;--btnink:#0d1117}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.card{fill:var(--card);stroke:var(--stroke);stroke-width:1.5}
.pill{fill:var(--pill)}
.sub{fill:var(--sub)}
.mute{fill:var(--mute)}
.acc{fill:var(--accent)}
</style><defs><clipPath id="clip"><rect width="250" height="240" rx="24"/></clipPath></defs><rect class="card" x=".75" y=".75" width="248.5" height="238.5" rx="24"/><g clip-path="url(#clip)"><rect class="pill" x="16" y="16" width="98" height="26" rx="13"/><text x="28" y="33" font-size="12">In progress</text><text x="18" y="68" font-size="15" font-weight="600">OpsPulse</text><text x="18" y="92" font-size="11" class="sub">FastAPI service that loads synthetic</text><text x="18" y="107" font-size="11" class="sub">incident data into SQL and serves</text><text x="18" y="122" font-size="11" class="sub">REST endpoints for recurring errors,</text><text x="18" y="137" font-size="11" class="sub">MTTR and SLA breaches, with tests.</text><rect class="pill" x="16" y="202" width="54" height="22" rx="11"/><text x="25" y="217" font-size="11">Python</text><rect class="pill" x="75" y="202" width="36" height="22" rx="11"/><text x="84" y="217" font-size="11">SQL</text><rect class="pill" x="116" y="202" width="60" height="22" rx="11"/><text x="125" y="217" font-size="11">FastAPI</text></g></svg>