<svg xmlns="http://www.w3.org/2000/svg" width="250" height="240" viewBox="0 0 250 240" role="img" aria-label="Music playlist"><title>Music playlist</title><style>
:root{--card:#fff;--stroke:#e9e9e9;--ink:#0d0d0d;--mute:#bdbdbd;--sub:#8c8c8c;--accent:#f26a00;--pill:#f3f3f3;--btn:#0d0d0d;--btnink:#fff}
@media (prefers-color-scheme:dark){:root{--card:#161b22;--stroke:#2a313c;--ink:#f0f3f6;--mute:#4b535e;--sub:#8b949e;--accent:#ff8a2a;--pill:#21262d;--btn:#f0f3f6;--btnink:#0d1117}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.card{fill:var(--card);stroke:var(--stroke);stroke-width:1.5}
.pill{fill:var(--pill)}
.sub{fill:var(--sub)}
.mute{fill:var(--mute)}
.acc{fill:var(--accent)}
</style><defs><clipPath id="clip"><rect width="250" height="240" rx="24"/></clipPath></defs><rect class="card" x=".75" y=".75" width="248.5" height="238.5" rx="24"/><g clip-path="url(#clip)"><rect class="pill" x="16" y="16" width="138" height="26" rx="13"/><text x="28" y="33" font-size="12">My music playlist</text><g transform="rotate(-8 50 130)"><rect x="14" y="82" width="82" height="82" rx="10" fill="#c9c9c9"/></g><g transform="rotate(8 200 130)"><rect x="158" y="82" width="82" height="82" rx="10" fill="#6b4a3a"/></g><rect x="79" y="56" width="100" height="100" rx="12" fill="#e8a33d"/><rect x="79" y="56" width="100" height="100" rx="12" fill="none" stroke="var(--card)" stroke-width="3"/><text x="125.0" y="190" font-size="14" font-weight="500" text-anchor="middle">Alex Playlist</text><path d="M77.05 203 L77.05 213 L85.05 208 Z" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round"/><text x="91.05" y="212" font-size="10.5" class="sub">Play on Spotify</text></g></svg>