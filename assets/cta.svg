<svg xmlns="http://www.w3.org/2000/svg" width="820" height="70" viewBox="0 0 820 70" role="img" aria-label="Book a call"><title>Book a call</title><style>
:root{--card:#fff;--stroke:#e9e9e9;--ink:#0d0d0d;--mute:#bdbdbd;--sub:#8c8c8c;--accent:#f26a00;--pill:#f3f3f3;--btn:#0d0d0d;--btnink:#fff}
@media (prefers-color-scheme:dark){:root{--card:#161b22;--stroke:#2a313c;--ink:#f0f3f6;--mute:#4b535e;--sub:#8b949e;--accent:#ff8a2a;--pill:#21262d;--btn:#f0f3f6;--btnink:#0d1117}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.card{fill:var(--card);stroke:var(--stroke);stroke-width:1.5}
.pill{fill:var(--pill)}
.sub{fill:var(--sub)}
.mute{fill:var(--mute)}
.acc{fill:var(--accent)}
</style><defs></defs><rect x="0" y="6" width="146" height="52" rx="26" fill="var(--btn)"/><text x="73" y="38" font-size="17" font-weight="500" text-anchor="middle" style="fill:var(--btnink)">Book a call</text><text x="168" y="29" font-size="18">Feel free to explore my portfolio and reach out</text><text x="168" y="53" font-size="18">—I’d love to connect!</text></svg>