<svg xmlns="http://www.w3.org/2000/svg" width="515" height="240" viewBox="0 0 515 240" role="img" aria-label="How I troubleshoot"><title>How I troubleshoot</title><style>
:root{--card:#fff;--stroke:#e9e9e9;--ink:#0d0d0d;--mute:#bdbdbd;--sub:#8c8c8c;--accent:#f26a00;--pill:#f3f3f3;--btn:#0d0d0d;--btnink:#fff}
@media (prefers-color-scheme:dark){:root{--card:#161b22;--stroke:#2a313c;--ink:#f0f3f6;--mute:#4b535e;--sub:#8b949e;--accent:#ff8a2a;--pill:#21262d;--btn:#f0f3f6;--btnink:#0d1117}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.card{fill:var(--card);stroke:var(--stroke);stroke-width:1.5}
.pill{fill:var(--pill)}
.sub{fill:var(--sub)}
.mute{fill:var(--mute)}
.acc{fill:var(--accent)}
.step,.act{opacity:0;animation:cyc 20s linear infinite}@keyframes cyc{0%{opacity:0}1.5%{opacity:1}18.5%{opacity:1}20.0%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion:reduce){.step,.act{animation:none}.s0,.a0{opacity:1}}</style><defs><clipPath id="clip"><rect width="515" height="240" rx="24"/></clipPath></defs><rect class="card" x=".75" y=".75" width="513.5" height="238.5" rx="24"/><g clip-path="url(#clip)"><rect class="pill" x="16" y="16" width="145" height="26" rx="13"/><text x="28" y="33" font-size="12">How I troubleshoot</text><g class="step s0" style="animation-delay:0s"><text x="24" y="92" font-size="16" font-weight="600">01 Triage</text><text x="24" y="116" font-size="11.5" class="sub">Read the ticket, check impact and SLA, and find out what changed. The incident</text><text x="24" y="132" font-size="11.5" class="sub">notes start here so the next person can pick up where I leave off.</text></g><g class="step s1" style="animation-delay:4s"><text x="24" y="92" font-size="16" font-weight="600">02 Scope</text><text x="24" y="116" font-size="11.5" class="sub">Confirm the fault from the user’s side, then work out whether it affects one</text><text x="24" y="132" font-size="11.5" class="sub">client, one server or the whole network path.</text></g><g class="step s2" style="animation-delay:8s"><text x="24" y="92" font-size="16" font-weight="600">03 Trace</text><text x="24" y="116" font-size="11.5" class="sub">Follow the path with ping, nslookup, ipconfig and logs. When the cause is not</text><text x="24" y="132" font-size="11.5" class="sub">obvious, I capture packets with Wireshark or scan with Nmap.</text></g><g class="step s3" style="animation-delay:12s"><text x="24" y="92" font-size="16" font-weight="600">04 Fix</text><text x="24" y="116" font-size="11.5" class="sub">Apply the fix and verify it with the user. If the issue keeps coming back, I</text><text x="24" y="132" font-size="11.5" class="sub">script it with Python or PowerShell over WinRM.</text></g><g class="step s4" style="animation-delay:16s"><text x="24" y="92" font-size="16" font-weight="600">05 Document &amp; escalate</text><text x="24" y="116" font-size="11.5" class="sub">Write up findings and the root cause. If it needs a higher team, escalate with</text><text x="24" y="132" font-size="11.5" class="sub">full notes and next steps.</text></g><rect x="16" y="180" width="483" height="44" rx="22" class="pill"/><text x="64.3" y="207" font-size="11.5" text-anchor="middle">Step 01</text><g class="act a0" style="animation-delay:0s"><rect x="20.0" y="184" width="88.6" height="36" rx="18" fill="var(--btn)"/><text x="64.3" y="207" font-size="11.5" text-anchor="middle" style="fill:var(--btnink)">Step 01</text></g><text x="160.89999999999998" y="207" font-size="11.5" text-anchor="middle">Step 02</text><g class="act a1" style="animation-delay:4s"><rect x="116.6" y="184" width="88.6" height="36" rx="18" fill="var(--btn)"/><text x="160.89999999999998" y="207" font-size="11.5" text-anchor="middle" style="fill:var(--btnink)">Step 02</text></g><text x="257.5" y="207" font-size="11.5" text-anchor="middle">Step 03</text><g class="act a2" style="animation-delay:8s"><rect x="213.2" y="184" width="88.6" height="36" rx="18" fill="var(--btn)"/><text x="257.5" y="207" font-size="11.5" text-anchor="middle" style="fill:var(--btnink)">Step 03</text></g><text x="354.09999999999997" y="207" font-size="11.5" text-anchor="middle">Step 04</text><g class="act a3" style="animation-delay:12s"><rect x="309.79999999999995" y="184" width="88.6" height="36" rx="18" fill="var(--btn)"/><text x="354.09999999999997" y="207" font-size="11.5" text-anchor="middle" style="fill:var(--btnink)">Step 04</text></g><text x="450.7" y="207" font-size="11.5" text-anchor="middle">Step 05</text><g class="act a4" style="animation-delay:16s"><rect x="406.4" y="184" width="88.6" height="36" rx="18" fill="var(--btn)"/><text x="450.7" y="207" font-size="11.5" text-anchor="middle" style="fill:var(--btnink)">Step 05</text></g></g></svg>