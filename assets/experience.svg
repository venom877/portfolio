<svg xmlns="http://www.w3.org/2000/svg" width="250" height="240" viewBox="0 0 250 240" role="img" aria-label="Experience"><title>Experience</title><style>
:root{--card:#fff;--stroke:#e9e9e9;--ink:#0d0d0d;--mute:#bdbdbd;--sub:#8c8c8c;--accent:#f26a00;--pill:#f3f3f3;--btn:#0d0d0d;--btnink:#fff}
@media (prefers-color-scheme:dark){:root{--card:#161b22;--stroke:#2a313c;--ink:#f0f3f6;--mute:#4b535e;--sub:#8b949e;--accent:#ff8a2a;--pill:#21262d;--btn:#f0f3f6;--btnink:#0d1117}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.card{fill:var(--card);stroke:var(--stroke);stroke-width:1.5}
.pill{fill:var(--pill)}
.sub{fill:var(--sub)}
.mute{fill:var(--mute)}
.acc{fill:var(--accent)}
</style><defs><clipPath id="clip"><rect width="250" height="240" rx="24"/></clipPath></defs><rect class="card" x=".75" y=".75" width="248.5" height="238.5" rx="24"/><g clip-path="url(#clip)"><rect class="pill" x="16" y="16" width="111" height="26" rx="13"/><text x="28" y="33" font-size="12">My Experience</text><line x1="28" y1="79" x2="28" y2="167" stroke="var(--ink)" stroke-width="1.5"/><circle cx="28" cy="79" r="5" fill="var(--ink)"/><text x="46" y="84" font-size="13.5" font-weight="500">Product Lead at Apple</text><text x="46" y="100" font-size="11" class="sub">2024 - On site - Full time</text><circle cx="28" cy="123" r="5" fill="var(--ink)"/><text x="46" y="128" font-size="13.5" font-weight="500">Product Designer at Apple</text><text x="46" y="144" font-size="11" class="sub">2023 - Hybrid - Part time</text><circle cx="28" cy="167" r="5" fill="var(--ink)"/><text x="46" y="172" font-size="13.5" font-weight="500">Ui-Ux Designer at Apple</text><text x="46" y="188" font-size="11" class="sub">2022 - Remote - Full time</text></g></svg>